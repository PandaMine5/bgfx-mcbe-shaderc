  linux:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { config: release },
        ]
    name: linux-x64 ${{ }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          path: bgfx
      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: cd bx && git checkout 198cd12 || cd ..
      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev zip
          cd bgfx
          make -j$(nproc) shaderc config=${{ matrix.config }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaderc-linux-x64
          path: ./bgfx/.build/linux64_gcc/bin/shaderc
      - name: Zip binary
        run: zip -j shaderc-linux-x64.zip ./bgfx/.build/linux64_gcc/bin/shaderc
      - name: Publish binary
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-linux-x64.zip
          tag_name: Shaderc
          fail_on_unmatched_files: true

  osx:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { config: release, binsuffix: Release },
        ]
    name: macos-x64
    runs-on: macos-latest
    steps:
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          path: bgfx
      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: cd bx && git checkout 198cd12 || cd ..
      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - name: Build
        run: |
          cd bgfx
          make -j$(sysctl -n hw.physicalcpu) shaderc config=${{ matrix.config }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaderc-macos-x64
          path: ./bgfx/.build/macos-x64/bin/shaderc
      - name: Zip binary
        run: zip -j shaderc-macos-x64.zip ./bgfx/.build/macos-x64/bin/shaderc
      - name: Publish binary
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-macos-x64.zip
          tag_name: Shaderc
          fail_on_unmatched_files: true

  android:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { platform: arm, label: arm32 },
          { platform: arm64, label: arm64 },
        ]
    name: android-${{ matrix.label }}
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: r25c
    steps:
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          path: bgfx
      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: cd bx && git checkout 198cd12 || cd ..
      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev zip
          ar -cr $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libpthread.a
          ar -cr $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libpthread.a
          cd bgfx
          make .build/projects/gmake-android-${{ matrix.platform }}
          make -j$(nproc) -R -C .build/projects/gmake-android-${{ matrix.platform }} shaderc config=release \
            CXXFLAGS="-O3 -ffunction-sections -fdata-sections" \
            LDFLAGS="-Wl,--gc-sections -s"
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Check
        run: |
          cd bgfx
          ls -lash ".build/android-${{ matrix.platform }}/bin"
          cp ".build/android-${{ matrix.platform }}/bin/shadercRelease" \
             ".build/android-${{ matrix.platform }}/bin/shaderc"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaderc-android-${{ matrix.platform }}
          path: ./bgfx/.build/android-${{ matrix.platform }}/bin/shaderc
      - name: Zip binary
        run: zip -j shaderc-android-${{ matrix.platform }}.zip ./bgfx/.build/android-${{ matrix.platform }}/bin/shaderc
      - name: Publish binary
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-android-${{ matrix.platform }}.zip
          tag_name: Shaderc
          fail_on_unmatched_files: true
