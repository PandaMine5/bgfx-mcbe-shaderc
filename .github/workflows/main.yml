  linux:
    name: linux-x64
    runs-on: ubuntu-22.04

    steps:
      - name: Restore shaderc cache
        id: shaderc-cache
        uses: actions/cache@v4
        with:
          path: bgfx/.build/linux64_gcc/bin/shadercRelease
          key: shaderc-linux-x64-${{ hashFiles('bgfx-revision.txt', 'bx-revision.txt', 'bimg-revision.txt') }}-release-v1

      - name: Checkout bgfx
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          path: bgfx

      - name: Checkout bx
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          ref: 198cd120e4941d8aeb677db945ef4291a1ced291
          path: bx

      # - name: Checkout bimg
      #   if: steps.shaderc-cache.outputs.cache-hit != 'true'
      #   uses: actions/checkout@v4
      #   with:
      #     repository: bkaradzic/bimg
      #     path: bimg

      - name: Cache ccache
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-x64-v1
          restore-keys: ccache-linux-x64-

      - name: Build shaderc
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev ccache mold

          cd bgfx

          make -j"$(nproc)" shaderc config=release \
            CXXFLAGS="-O3 -march=x86-64-v2 -flto=auto -fdata-sections -ffunction-sections -fvisibility=hidden" \
            LDFLAGS="-fuse-ld=mold -flto=auto -Wl,--gc-sections -Wl,--as-needed -s"

      - name: Publish binary
        run: |
          mkdir -p dist
          cp bgfx/.build/linux64_gcc/bin/shadercRelease dist/shaderc
          cd dist
          python3 -m zipfile -c ../shaderc-linux-x64.zip shaderc

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-linux-x64.zip
          tag_name: Shaderc
          fail_on_unmatched_files: true


  osx:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { config: release },
        ]
    name: macos-x64
    runs-on: macos-latest
    steps:
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          path: bgfx
      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: cd bx && git checkout 198cd12 || cd ..
      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - name: Build
        run: |
          cd bgfx
          make -j$(sysctl -n hw.physicalcpu) shaderc config=${{ matrix.config }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaderc-macos-x64
          path: ./bgfx/.build/macos-x64/bin/shadercRelease
      - name: Zip binary
        run: zip -j shaderc-macos-x64.zip ./bgfx/.build/macos-x64/bin/shadercRelease
      - name: Publish binary
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-macos-x64.zip
          tag_name: Shaderc
          fail_on_unmatched_files: true

  android:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { platform: arm, label: arm32 },
          { platform: arm64, label: arm64 },
        ]
    name: android-${{ matrix.label }}
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: r25c
    steps:
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          path: bgfx
      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: cd bx && git checkout 198cd12 || cd ..
      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
          fetch-depth: 0
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev zip
          ar -cr $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libpthread.a
          ar -cr $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libpthread.a
          
          cd bgfx

          make .build/projects/gmake-android-${{ matrix.platform }}
          make -j$(nproc) -R -C .build/projects/gmake-android-${{ matrix.platform }} shaderc config=release \
            CXXFLAGS="-O3 -flto=thin -fdata-sections -ffunction-sections -fvisibility=hidden" \
            LDFLAGS="-flto=thin -Wl,--gc-sections -Wl,--as-needed -s"
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Check
        run: |
          cd bgfx
          ls -lash ".build/android-${{ matrix.platform }}/bin"
      - name: Prepare binary
        run: |
          mkdir -p out
          cp ./bgfx/.build/android-${{ matrix.platform }}/bin/libshadercRelease out/shaderc
          chmod +x out/shaderc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaderc-android-${{ matrix.platform }}
          path: out/shaderc

      - name: Zip binary
        run: zip -j shaderc-android-${{ matrix.platform }}.zip out/shaderc

      - name: Publish binary
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-android-${{ matrix.platform }}.zip
          tag_name: Shaderc
          fail_on_unmatched_files: true
